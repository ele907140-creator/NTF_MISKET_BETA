<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT P2P</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial;
    background: #f4f4f5;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 15px;
    margin: 12px 0;
    border-radius: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: #2481cc;
    color: white;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>🎁 NFT P2P</h1>

<div class="card">
    <h2>🛒 Купить NFT</h2>
    <p>Здесь будут объявления пользователей.</p>
    <button>Открыть объявления</button>
</div>

<div class="card">
    <h2>➕ Продать NFT</h2>
    <p>Вы сможете выставить свой NFT.</p>
    <button>Выставить NFT</button>
</div>

<div class="card">
    <h2>👤 Профиль</h2>
    <p id="user">Загрузка...</p>
</div>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

if (user) {
    document.getElementById("user").textContent =
        "Пользователь: " + user.first_name;
} else {
    document.getElementById("user").textContent =
        "Откройте приложение через Telegram";
}
</script>

</body>
</html>
